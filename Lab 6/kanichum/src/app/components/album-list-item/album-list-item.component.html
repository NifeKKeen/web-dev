<li class="album-item" [routerLink]="['/albums', album().id]">
  <div class="album-cover" [style.background-image]="'url(' + album().coverSrc + ')'"></div>

  <div class="album-overlay">
    <div class="album-info">
      <span class="album-title">{{album().title}}</span>
    </div>
    <div class="album-actions">
      <a class="btn btn-secondary" [routerLink]="['/albums', album().id, 'photos']" (click)="$event.stopPropagation()">Photos</a>
      <button class="btn btn-danger" (click)="$event.stopPropagation(); delete.emit(album().id)">Delete</button>
    </div>
  </div>
</li>
